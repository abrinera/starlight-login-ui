<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starlight Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff8f1;
    --blush: #f6dbe3;
    --rose: #e8a9bc;
    --rose-d: #c98aa3;
    --mauve: #8f6e8f;
    --plum: #5e4565;
    --ink: #4a3650;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    position: relative;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 50% 0%, #c9a5c4 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 110%, #f7d2da 0%, transparent 60%),
      linear-gradient(180deg, #b994b8 0%, #e5bfd0 55%, #f8dde3 100%);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- ambient background ---------- */
  .sky, #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .sky { z-index: 0; }
  #fx { z-index: 50; }
  .blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 380px; height: 380px; background: #f3bfd0; left: -80px; top: 10%; }
  .blob:nth-child(2) { width: 460px; height: 460px; background: #c7a3d1; right: -120px; top: -60px; animation-duration: 28s; }
  .blob:nth-child(3) { width: 340px; height: 340px; background: #fbe0e6; left: 35%; bottom: -120px; animation-duration: 18s; }
  @keyframes drift { to { transform: translate(60px, -40px) scale(1.15); } }

  .star { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite; }
  .star.glyph { background: none; box-shadow: none; color: #fff; text-shadow: 0 0 8px #fff; line-height: 1; }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }

  .petal { position: absolute; top: -40px; width: var(--s); height: var(--s); border-radius: 60% 0 60% 0; background: linear-gradient(135deg, #fbe3ea, var(--rose)); opacity: .8; animation: fall var(--d) linear var(--delay) infinite; }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(var(--sway), 30vh) rotate(120deg); }
    50% { transform: translate(0, 60vh) rotate(220deg); }
    75% { transform: translate(calc(var(--sway) * -1), 90vh) rotate(300deg); }
    100% { transform: translate(0, 120vh) rotate(420deg); }
  }

  .shoot { position: absolute; width: 140px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #fff, transparent); opacity: 0; transform: rotate(-25deg); animation: shoot 11s ease-in infinite; }
  .shoot:nth-of-type(1) { top: 12%; left: 72%; }
  .shoot:nth-of-type(2) { top: 30%; left: 20%; animation-delay: 5.5s; }
  @keyframes shoot {
    0%, 88% { opacity: 0; transform: rotate(-25deg) translateX(0); }
    90% { opacity: 1; }
    100% { opacity: 0; transform: rotate(-25deg) translateX(-420px); }
  }

  .spark { position: absolute; pointer-events: none; line-height: 1; text-shadow: 0 0 6px currentColor; }

  /* ---------- scene: fixed 760x820 illustration, scaled to fit by JS ---------- */
  .stage {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 760px; height: 820px;
    translate: -50% -50%; scale: var(--k, 1);
    perspective: 1600px; perspective-origin: 380px 410px;
  }
  .ornament { position: absolute; inset: 0; animation: haloBob 9s ease-in-out infinite; transition: translate .6s ease-out; }
  .ornament svg { width: 100%; height: 100%; overflow: visible; color: var(--cream); }
  @keyframes haloBob { 50% { transform: translateY(8px); } }

  .sc-out { fill: none; stroke: #b97590; stroke-width: 11; stroke-linecap: round; }
  .sc-in { fill: none; stroke: #f8d6e0; stroke-width: 6; stroke-linecap: round; }
  .orbit, .orbit-spin, .rays { transform-box: view-box; }
  .orbit { transform-origin: 380px 215px; animation: spin 60s linear infinite; }
  .orbit-spin { transform-origin: 380px 215px; }
  .rays { transform-origin: 380px 197px; animation: spin 90s linear infinite reverse; }
  .sway { transform-box: fill-box; transform-origin: center; animation: sway var(--d, 6s) ease-in-out var(--delay, 0s) infinite; }
  .tw { transform-box: fill-box; transform-origin: center; animation: twinkle var(--d, 2.6s) ease-in-out var(--delay, 0s) infinite; }
  .bub { transform-box: fill-box; transform-origin: center; animation: bubble var(--d, 5s) ease-in-out var(--delay, 0s) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sway { 0%, 100% { transform: rotate(-5deg) scale(1); } 50% { transform: rotate(5deg) scale(1.04); } }
  @keyframes bubble { 50% { transform: translateY(-10px) scale(1.08); } }

  .float { position: absolute; left: 130px; top: 200px; width: 500px; height: 420px; }
  .float, .tilt, .spinfx, .card { transform-style: preserve-3d; }
  .tilt, .spinfx, .card { position: absolute; inset: 0; }
  .float { animation: enter 1.3s cubic-bezier(.2, .8, .2, 1) both, bob 7s ease-in-out 1.3s infinite; }
  @keyframes enter { from { opacity: 0; transform: translateY(70px) scale(.88) rotateX(25deg); } }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-10px) rotate(.6deg); }
    50% { transform: translateY(-18px) rotate(0); }
    75% { transform: translateY(-8px) rotate(-.6deg); }
  }
  .tilt { transition: transform .5s ease-out; }
  .card { transition: transform 1.5s cubic-bezier(.65, 0, .25, 1); }
  .card.flipped { transform: rotateY(540deg); }

  /* ---------- card faces ---------- */
  .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .frame { position: absolute; left: -30px; top: -30px; width: 560px; height: 480px; filter: drop-shadow(0 18px 22px rgba(78, 52, 86, .45)); }
  .content { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 46px 52px 48px; }

  .corner { position: absolute; width: 44px; height: 44px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle, var(--cream) 0 20%, var(--rose) 22% 40%, var(--cream) 42% 48%, var(--mauve) 50% 100%);
    border: 2px solid var(--cream); box-shadow: 0 0 0 1.5px var(--mauve), 0 0 12px rgba(255, 255, 255, .8); animation: pulse 3s ease-in-out infinite; }
  .corner.tl { top: -22px; left: -22px; } .corner.tr { top: -22px; right: -22px; animation-delay: .75s; }
  .corner.br { bottom: -22px; right: -22px; animation-delay: 1.5s; } .corner.bl { bottom: -22px; left: -22px; animation-delay: 2.25s; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 1.5px var(--mauve), 0 0 22px 5px rgba(255, 255, 255, .95); } }

  .medal { position: absolute; left: 50%; width: 74px; height: 74px; margin-left: -37px; border-radius: 50%; display: grid; place-items: center; z-index: 3;
    background: radial-gradient(circle, var(--cream) 55%, var(--blush) 56%, var(--blush) 66%, var(--mauve) 67%);
    box-shadow: 0 0 0 3px var(--cream), 0 0 0 5px var(--mauve), 0 8px 20px rgba(78, 52, 86, .35); }
  .medal.top { top: -40px; } .medal.bottom { bottom: -36px; width: 60px; height: 60px; margin-left: -30px; }
  .medal::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 1.5px dashed var(--cream); animation: spin 12s linear infinite; }
  .medal svg { width: 52%; height: 52%; overflow: visible; }
  .medal.top svg { animation: starGlow 4s ease-in-out infinite; }
  .medal.bottom svg { animation: rock 5s ease-in-out infinite; }
  @keyframes starGlow { 0%, 100% { transform: rotate(0) scale(1); filter: drop-shadow(0 0 0 transparent); } 50% { transform: rotate(36deg) scale(1.12); filter: drop-shadow(0 0 6px #fff); } }
  @keyframes rock { 50% { transform: rotate(-18deg); } }

  h2 { margin: 0; text-align: center; font: 700 1.55rem/1.15 "Cinzel Decorative", serif; color: var(--plum); letter-spacing: .04em; }
  .sub { margin: -6px 0 2px; text-align: center; font-size: 1.05rem; font-style: italic; color: var(--mauve); }
  .sub::before, .sub::after { content: " ✦ "; font-style: normal; font-size: .7em; color: var(--rose-d); }
  form { display: flex; flex-direction: column; gap: 10px; width: 74%; }

  .field { position: relative; }
  .field input {
    width: 100%; padding: 18px 20px 6px; border-radius: 999px;
    border: 1.5px solid var(--mauve); background: rgba(255, 255, 255, .7);
    font: 600 1rem "Cormorant Garamond", serif; color: var(--ink); outline: none;
    box-shadow: inset 0 2px 5px rgba(143, 110, 143, .15), 0 0 0 3px var(--cream), 0 0 0 4px #d9b3c6;
    transition: border-color .25s, box-shadow .25s, transform .25s;
  }
  .field input:focus { border-color: var(--plum); box-shadow: inset 0 2px 5px rgba(143, 110, 143, .15), 0 0 0 4px rgba(232, 169, 188, .6), 0 0 18px rgba(232, 169, 188, .7); transform: translateY(-1px); }
  .field label { position: absolute; left: 21px; top: 50%; transform: translateY(-50%); pointer-events: none; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; color: var(--mauve); white-space: nowrap; transition: top .25s, font-size .25s, color .25s, transform .25s; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: 7px; transform: none; font-size: .6rem; color: var(--plum); }
  .field.shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

  .row { display: flex; justify-content: flex-end; margin: -4px 6px -2px 0; }
  .link { background: none; border: 0; padding: 2px; font: inherit; font-weight: 700; color: var(--plum); cursor: pointer; text-decoration: underline; text-decoration-color: var(--rose); text-underline-offset: 3px; transition: color .2s; }
  .link:hover { color: var(--rose-d); }
  .link:focus-visible, .btn:focus-visible { outline: 2px solid var(--plum); outline-offset: 3px; }
  .row .link { font-size: .92rem; font-weight: 600; }

  .btn { position: relative; overflow: hidden; align-self: center; width: 62%; padding: 13px 10px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, #9d7b9c, var(--plum)); color: var(--cream);
    font: 700 .88rem/1 "Cinzel Decorative", serif; letter-spacing: .2em;
    box-shadow: 0 8px 18px -6px rgba(78, 52, 86, .6), inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 0 3px var(--cream), 0 0 0 4px #d9b3c6;
    transition: transform .2s, box-shadow .2s; }
  .btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%); transform: translateX(-100%); animation: shimmer 3.6s ease-in-out infinite; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -6px rgba(78, 52, 86, .7), 0 0 18px rgba(232, 169, 188, .8), 0 0 0 3px var(--cream), 0 0 0 4px #d9b3c6; }
  .btn:active { transform: scale(.96); }
  @keyframes shimmer { 0%, 55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .msg { min-height: 1.1em; margin: 0; text-align: center; font-style: italic; color: var(--plum); }
  .msg span { font-style: normal; letter-spacing: .5em; color: var(--mauve); }
  .switch { margin: 0; text-align: center; font-size: 1rem; }

  @media (max-width: 560px) {
    .field input { font-size: 1.3rem; }
    .field label { font-size: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .petal, .shoot { display: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
  <span class="shoot"></span><span class="shoot"></span>
</div>
<div id="fx" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rose" viewBox="-50 -50 100 100">
      <g fill="#f6d0dc" stroke="#c98aa3" stroke-width="2">
        <circle cy="-28" r="20"/><circle cx="24" cy="-14" r="20"/><circle cx="24" cy="14" r="20"/>
        <circle cy="28" r="20"/><circle cx="-24" cy="14" r="20"/><circle cx="-24" cy="-14" r="20"/>
      </g>
      <circle r="30" fill="#eeb6c8" stroke="#c98aa3" stroke-width="2"/>
      <path d="M-24 6C-24-22 24-22 24 6" fill="none" stroke="#b97590" stroke-width="2"/>
      <path d="M-14 2A14 14 0 0 1 14 2A10 10 0 0 1-6 2A6 6 0 0 1 6 2A3 3 0 0 1 0 2" fill="none" stroke="#a9667f" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="leaf" viewBox="0 -20 64 40">
      <path d="M0 0C20-20 48-12 62 0C48 12 20 20 0 0Z" fill="#e2b6c9" stroke="#a9798f" stroke-width="2"/>
      <path d="M4 0H56" stroke="#a9798f" stroke-width="1.5"/>
    </symbol>
    <symbol id="bubble" viewBox="-20 -20 40 40">
      <circle r="18" fill="#f8dbe4" fill-opacity=".75" stroke="#c98aa3" stroke-width="1.5"/>
      <path d="M-11-5A12 12 0 0 1-3-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0-10L2.5-2.5L10 0L2.5 2.5L0 10L-2.5 2.5L-10 0L-2.5-2.5Z" fill="currentColor"/>
    </symbol>
    <!-- spiral scroll: tail from lower-left, curling into a spiral at (30,0) -->
    <path id="scrollD" d="M-70 70C-40 70 0 40 0 0A30 30 0 0 1 60 0A24 24 0 0 1 12 0A18 18 0 0 1 48 0A12 12 0 0 1 24 0A6 6 0 0 1 36 0"/>
    <g id="scroll"><use href="#scrollD" class="sc-out"/><use href="#scrollD" class="sc-in"/></g>

    <linearGradient id="archFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e4565"/><stop offset=".7" stop-color="#8f6e8f"/><stop offset="1" stop-color="#b892b3"/>
    </linearGradient>
    <linearGradient id="archFillUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5e4565"/><stop offset=".7" stop-color="#8f6e8f"/><stop offset="1" stop-color="#b892b3"/>
    </linearGradient>
    <radialGradient id="cardFill" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#fff8f1"/><stop offset="1" stop-color="#f9e9e6"/>
    </radialGradient>
    <clipPath id="domeClip"><circle cx="380" cy="215" r="190"/></clipPath>

    <!-- card frame: notched corners, mauve plate, cream panel, double inner border, side diamonds -->
    <symbol id="frame" viewBox="-30 -30 560 480">
      <g fill="#8f6e8f" stroke="#f6d0dc" stroke-width="2">
        <path d="M-26 210L0 174L14 210L0 246Z"/>
        <path d="M526 210L500 174L486 210L500 246Z"/>
      </g>
      <g fill="#fff8f1"><circle cx="-14" cy="210" r="3.5"/><circle cx="514" cy="210" r="3.5"/></g>
      <path d="M28 0H472A28 28 0 0 0 500 28V392A28 28 0 0 0 472 420H28A28 28 0 0 0 0 392V28A28 28 0 0 0 28 0Z" fill="#8f6e8f" stroke="#f6d0dc" stroke-width="2"/>
      <path d="M36 8H464A28 28 0 0 0 492 36V384A28 28 0 0 0 464 412H36A28 28 0 0 0 8 384V36A28 28 0 0 0 36 8Z" fill="url(#cardFill)"/>
      <path d="M44 18H456A26 26 0 0 0 482 44V376A26 26 0 0 0 456 402H44A26 26 0 0 0 18 376V44A26 26 0 0 0 44 18Z" fill="none" stroke="#8f6e8f" stroke-width="2"/>
      <path d="M50 25H450A25 25 0 0 0 475 50V370A25 25 0 0 0 450 395H50A25 25 0 0 0 25 370V50A25 25 0 0 0 50 25Z" fill="none" stroke="#d9a7bb" stroke-width="1" stroke-dasharray="4 4"/>
      <g color="#8f6e8f">
        <use href="#sparkle" x="50" y="50" width="16" height="16"/><use href="#sparkle" x="434" y="50" width="16" height="16"/>
        <use href="#sparkle" x="50" y="354" width="16" height="16"/><use href="#sparkle" x="434" y="354" width="16" height="16"/>
        <use href="#sparkle" x="36" y="204" width="12" height="12"/><use href="#sparkle" x="452" y="204" width="12" height="12"/>
      </g>
    </symbol>
  </defs>
</svg>

<h1 class="sr-only">Starlight account</h1>

<main class="stage">
  <div class="ornament" aria-hidden="true">
    <svg viewBox="0 0 760 820">
      <!-- rotating star orbit -->
      <g class="orbit-spin"><g class="orbit">
        <circle cx="380" cy="215" r="250" fill="none" stroke="#fff8f1" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 10"/>
        <use href="#sparkle" x="119" y="204" width="22" height="22"/>
        <use href="#sparkle" x="619" y="204" width="22" height="22"/>
        <use href="#sparkle" x="371" y="-44" width="18" height="18"/>
        <use href="#sparkle" x="200" y="34" width="14" height="14"/>
        <use href="#sparkle" x="546" y="34" width="14" height="14"/>
        <use href="#sparkle" x="373" y="458" width="14" height="14"/>
      </g></g>

      <!-- domes: top arch with sunburst, lower arch -->
      <circle cx="380" cy="215" r="200" fill="none" stroke="#f6d0dc" stroke-width="7" stroke-dasharray="0 15" stroke-linecap="round"/>
      <circle cx="380" cy="215" r="190" fill="url(#archFill)" stroke="#e9c3d3" stroke-width="2"/>
      <g clip-path="url(#domeClip)">
        <circle class="rays" cx="380" cy="197" r="130" fill="none" stroke="#fff0f5" stroke-opacity=".14" stroke-width="260" stroke-dasharray="5 16"/>
        <use class="tw" href="#sparkle" x="292" y="82" width="16" height="16" style="--delay:.3s"/>
        <use class="tw" href="#sparkle" x="452" y="72" width="16" height="16" style="--delay:1.1s"/>
        <use class="tw" href="#sparkle" x="335" y="45" width="10" height="10" style="--delay:1.8s"/>
        <use class="tw" href="#sparkle" x="420" y="128" width="9" height="9" style="--delay:.8s"/>
        <use class="tw" href="#sparkle" x="240" y="170" width="10" height="10" style="--delay:2.2s"/>
        <use class="tw" href="#sparkle" x="505" y="160" width="12" height="12" style="--delay:1.5s"/>
        <use class="tw" href="#sparkle" x="372" y="62" width="16" height="16" style="--delay:.5s"/>
      </g>
      <circle cx="380" cy="197" r="56" fill="none" stroke="#fff8f1" stroke-opacity=".55" stroke-width="1.5"/>
      <use class="tw" href="#sparkle" x="366" y="-6" width="28" height="28"/>

      <circle cx="380" cy="620" r="158" fill="none" stroke="#f6d0dc" stroke-width="7" stroke-dasharray="0 15" stroke-linecap="round"/>
      <circle cx="380" cy="620" r="150" fill="url(#archFillUp)" stroke="#e9c3d3" stroke-width="2"/>

      <!-- back panel behind the card (left half; JS mirrors every .half) -->
      <g class="half">
        <path d="M380 180H210C150 180 100 205 100 260V560C100 615 150 640 210 640H380" fill="#7d5f80" stroke="#f6d0dc" stroke-width="3"/>
        <path d="M380 192H212C160 192 112 214 112 262V558C112 606 160 628 212 628H380" fill="none" stroke="#c99bbd" stroke-width="1.5"/>
        <circle cx="106" cy="410" r="5" fill="#f6d0dc"/>
      </g>

      <!-- front ornaments (left half) -->
      <g class="half">
        <!-- curled horn beside the star medallion -->
        <use href="#scroll" transform="translate(289 135) scale(-.9 .9)"/>
        <use class="tw" href="#sparkle" x="252" y="125" width="20" height="20" style="--delay:.6s"/>

        <!-- side filigree swirls -->
        <use href="#scroll" transform="translate(70 300) rotate(90) scale(.8)"/>
        <use href="#scroll" transform="translate(70 520) rotate(-90) scale(.8)"/>
        <g stroke="#b97590" stroke-width="2"><path d="M24 350V470"/></g>
        <path d="M24 334L32 350L24 366L16 350Z" fill="#f6d0dc" stroke="#8f6e8f" stroke-width="2"/>
        <circle cx="24" cy="478" r="7" fill="#f6d0dc" stroke="#8f6e8f" stroke-width="2"/>

        <!-- upper peonies -->
        <g class="sway" style="--d:7s"><use href="#leaf" x="160" y="150" width="80" height="50"/><use href="#leaf" x="60" y="40" width="70" height="44"/></g>
        <g class="sway" style="--d:8s;--delay:-2s"><use href="#rose" x="95" y="75" width="110" height="110"/></g>
        <g class="sway" style="--d:6.5s;--delay:-1s"><use href="#rose" x="180" y="25" width="70" height="70"/></g>
        <g class="sway" style="--d:7.5s;--delay:-3s"><use href="#rose" x="45" y="165" width="80" height="80"/></g>

        <!-- lower peonies and bubbles -->
        <g class="sway" style="--d:9s;--delay:-1.5s"><use href="#leaf" x="110" y="560" width="80" height="50"/><use href="#leaf" x="-10" y="700" width="76" height="48"/></g>
        <g class="sway" style="--d:7s;--delay:-4s"><use href="#rose" x="10" y="570" width="120" height="120"/></g>
        <g class="sway" style="--d:8.5s;--delay:-2.5s"><use href="#rose" x="105" y="655" width="90" height="90"/></g>
        <g class="sway" style="--d:6s;--delay:-5s"><use href="#rose" x="200" y="735" width="60" height="60"/></g>
        <use class="bub" href="#bubble" x="14" y="530" width="30" height="30" style="--d:5s"/>
        <use class="bub" href="#bubble" x="20" y="700" width="40" height="40" style="--d:6s;--delay:-2s"/>
        <use class="bub" href="#bubble" x="70" y="760" width="32" height="32" style="--d:4.5s;--delay:-1s"/>
        <use class="bub" href="#bubble" x="250" y="690" width="22" height="22" style="--d:5.5s;--delay:-3s"/>

        <!-- loose sparkles -->
        <use class="tw" href="#sparkle" x="30" y="100" width="14" height="14" style="--delay:1.2s"/>
        <use class="tw" href="#sparkle" x="40" y="270" width="10" height="10" style="--delay:.4s"/>
        <use class="tw" href="#sparkle" x="60" y="420" width="12" height="12" style="--delay:2s"/>
        <use class="tw" href="#sparkle" x="210" y="790" width="10" height="10" style="--delay:1.6s"/>
      </g>

      <!-- pendant under the moon medallion -->
      <path d="M380 656V668" stroke="#8f6e8f" stroke-width="2"/>
      <path d="M380 668L398 702L380 742L362 702Z" fill="#f6d0dc" stroke="#8f6e8f" stroke-width="2"/>
      <circle cx="380" cy="702" r="7" fill="#fff8f1" stroke="#8f6e8f" stroke-width="1.5"/>
      <use class="tw" href="#sparkle" x="370" y="758" width="20" height="20" style="--delay:.9s"/>
    </svg>
  </div>

  <div class="float">
    <div class="tilt">
      <div class="spinfx">
        <div class="card" id="card">

          <section class="face front" aria-labelledby="login-title">
            <svg class="frame" aria-hidden="true"><use href="#frame"/></svg>
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner br"></span><span class="corner bl"></span>
            <div class="medal top" aria-hidden="true"><svg viewBox="-10 -10 20 20"><polygon points="0,-10 2.9,-4 9.5,-3.1 4.7,1.5 5.9,8.1 0,5 -5.9,8.1 -4.7,1.5 -9.5,-3.1 -2.9,-4" fill="#8f6e8f"/></svg></div>
            <div class="medal bottom" aria-hidden="true"><svg viewBox="-10 -10 20 20"><circle r="8" fill="#8f6e8f"/><circle cx="3.6" cy="-2.6" r="7" fill="#fff8f1"/></svg></div>
            <div class="content">
              <h2 id="login-title">Welcome Back</h2>
              <p class="sub">the stars remember you</p>
              <form id="login-form" novalidate>
                <div class="field"><input id="li-email" type="email" placeholder=" " autocomplete="email" required><label for="li-email">Email</label></div>
                <div class="field"><input id="li-pass" type="password" placeholder=" " autocomplete="current-password" required minlength="6"><label for="li-pass">Password</label></div>
                <div class="row"><button type="button" class="link">Forgot password?</button></div>
                <button class="btn" type="submit">Log In</button>
                <p class="msg" role="status"><span aria-hidden="true">✦★✦</span></p>
              </form>
              <p class="switch">New here? <button type="button" class="link" data-go="signup">Create an account</button></p>
            </div>
          </section>

          <section class="face back" aria-labelledby="signup-title" inert>
            <svg class="frame" aria-hidden="true"><use href="#frame"/></svg>
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner br"></span><span class="corner bl"></span>
            <div class="medal top" aria-hidden="true"><svg viewBox="-10 -10 20 20"><polygon points="0,-10 2.9,-4 9.5,-3.1 4.7,1.5 5.9,8.1 0,5 -5.9,8.1 -4.7,1.5 -9.5,-3.1 -2.9,-4" fill="#8f6e8f"/></svg></div>
            <div class="medal bottom" aria-hidden="true"><svg viewBox="-10 -10 20 20"><circle r="8" fill="#8f6e8f"/><circle cx="3.6" cy="-2.6" r="7" fill="#fff8f1"/></svg></div>
            <div class="content">
              <h2 id="signup-title">Join the Stars</h2>
              <p class="sub">begin your constellation</p>
              <form id="signup-form" novalidate>
                <div class="field"><input id="su-name" type="text" placeholder=" " autocomplete="name" required><label for="su-name">Name</label></div>
                <div class="field"><input id="su-email" type="email" placeholder=" " autocomplete="email" required><label for="su-email">Email</label></div>
                <div class="field"><input id="su-pass" type="password" placeholder=" " autocomplete="new-password" required minlength="6"><label for="su-pass">Password</label></div>
                <button class="btn" type="submit">Sign Up</button>
                <p class="msg" role="status"><span aria-hidden="true">✦★✦</span></p>
              </form>
              <p class="switch">Already a star? <button type="button" class="link" data-go="login">Log in</button></p>
            </div>
          </section>

        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = s => document.querySelector(s);
  const card = $('#card'), front = $('.front'), back = $('.back');
  const tilt = $('.tilt'), spinfx = $('.spinfx'), ornament = $('.ornament'), orbitSpin = $('.orbit-spin');
  const fx = $('#fx'), sky = $('.sky');
  const palette = ['#fff8f1', '#f6dbe3', '#e8a9bc', '#c9a5c4', '#ffffff'];
  const rand = (a, b) => a + Math.random() * (b - a);

  // mirror the left-half ornaments onto the right
  document.querySelectorAll('.half').forEach(g => {
    const m = g.cloneNode(true);
    m.setAttribute('transform', 'translate(760 0) scale(-1 1)');
    g.after(m);
  });

  // scale the 760x820 scene so the card always fits; side ornaments may crop on phones
  const fit = () => document.documentElement.style.setProperty('--k',
    Math.min(1, (innerWidth - 24) / 540, (innerHeight - 24) / 640));
  fit();
  addEventListener('resize', fit);

  // ambient stars and petals
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('span');
    const glyph = i % 8 === 0;
    s.className = glyph ? 'star glyph' : 'star';
    if (glyph) { s.textContent = '✦'; s.style.fontSize = rand(8, 16) + 'px'; }
    else { const z = rand(1, 3.2); s.style.width = s.style.height = z + 'px'; }
    s.style.left = rand(0, 100) + '%';
    s.style.top = rand(0, 100) + '%';
    s.style.setProperty('--d', rand(2, 5) + 's');
    s.style.setProperty('--delay', -rand(0, 5) + 's');
    sky.append(s);
  }
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.style.left = rand(0, 100) + '%';
    p.style.setProperty('--s', rand(8, 16) + 'px');
    p.style.setProperty('--d', rand(12, 22) + 's');
    p.style.setProperty('--delay', -rand(0, 22) + 's');
    p.style.setProperty('--sway', rand(30, 90) + 'px');
    sky.append(p);
  }

  function burst(x, y, n, spread, dur = 1200) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = Math.random() < .7 ? '✦' : '•';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.color = palette[i % palette.length];
      s.style.fontSize = rand(8, 20) + 'px';
      fx.append(s);
      const a = rand(0, Math.PI * 2), d = spread * rand(.35, 1);
      s.animate([
        { transform: 'translate(-50%, -50%) scale(0) rotate(0)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d * .6}px), calc(-50% + ${Math.sin(a) * d * .6}px)) scale(1.2) rotate(180deg)`, opacity: 1, offset: .5 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 30}px)) scale(.4) rotate(360deg)`, opacity: 0 }
      ], { duration: dur * rand(.7, 1.3), delay: rand(0, 200), easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'both' }).onfinish = () => s.remove();
    }
  }

  // login <-> signup spin
  let busy = false;
  function go(toSignup) {
    if (busy) return;
    busy = true;
    card.classList.toggle('flipped', toSignup);
    front.inert = toSignup;
    back.inert = !toSignup;
    const dur = reduce ? 0 : 1500;
    if (!reduce) {
      spinfx.animate([
        { transform: 'scale(1) rotateZ(0) translateZ(0)' },
        { transform: `scale(.8) rotateZ(${toSignup ? -6 : 6}deg) translateZ(-120px)`, offset: .45 },
        { transform: `scale(1.05) rotateZ(${toSignup ? 2 : -2}deg) translateZ(30px)`, offset: .8 },
        { transform: 'scale(1) rotateZ(0) translateZ(0)' }
      ], { duration: dur, easing: 'ease-in-out' });
      orbitSpin.animate([{ transform: 'rotate(0)' }, { transform: `rotate(${toSignup ? 720 : -720}deg)` }],
        { duration: dur + 300, easing: 'cubic-bezier(.6, 0, .2, 1)' });
      ornament.animate([{ scale: 1 }, { scale: 1.05, offset: .5 }, { scale: 1 }], { duration: dur, easing: 'ease-in-out' });
      const r = card.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      burst(cx, cy, 30, 320);
      setTimeout(() => burst(cx, cy, 40, 420, 1400), dur * .55);
    }
    setTimeout(() => {
      busy = false;
      (toSignup ? back : front).querySelector('input').focus({ preventScroll: true });
    }, dur);
  }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go === 'signup')));

  // forms (front-end only: no backend wired up)
  document.querySelectorAll('form').forEach(f => {
    f.addEventListener('submit', e => {
      e.preventDefault();
      const msg = f.querySelector('.msg');
      const bad = [...f.elements].find(el => el.willValidate && !el.checkValidity());
      if (bad) {
        const field = bad.closest('.field');
        field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
        msg.textContent = bad.validationMessage;
        bad.focus();
        return;
      }
      msg.textContent = f.id === 'login-form' ? 'Welcome back, starlight ✦' : 'Your star has been born ✦';
      const r = f.querySelector('.btn').getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 44, 260);
    });
  });

  // pointer tilt, parallax and sparkle trail
  let last = 0;
  addEventListener('pointermove', e => {
    if (reduce || e.pointerType !== 'mouse') return;
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    tilt.style.transform = `rotateX(${-y * 10}deg) rotateY(${x * 14}deg)`;
    ornament.style.translate = `${x * -22}px ${y * -16}px`;
    if (e.timeStamp - last > 50) { last = e.timeStamp; burst(e.clientX, e.clientY, 1, 40, 900); }
  });
  document.addEventListener('pointerleave', () => { tilt.style.transform = ''; ornament.style.translate = ''; });
</script>
</body>
</html>
